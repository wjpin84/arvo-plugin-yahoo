[package]
name = "arvo-plugin-yahoo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Yahoo Finance as an Arvo source plugin: a thin binary over arvo-yfinance, served over gRPC (ADR-0022)."
repository = "https://github.com/wjpin84/arvo-plugin-yahoo"

# Its own workspace root, so cargo never adopts a manifest from a parent
# directory.
[workspace]

[[bin]]
name = "arvo-plugin-yahoo"
path = "src/main.rs"

[dependencies]
# The host half of the boundary: the proto, the server helper, and the
# manifest. Pinned to the tag this plugin was built against.
arvo-plugin-host = { git = "https://github.com/wjpin84/arvo-desktop.git", tag = "v0.1.0" }
# Everything Yahoo-specific. This crate adds a process boundary and nothing else.
arvo-yfinance = { git = "https://github.com/wjpin84/arvo-desktop.git", tag = "v0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# The trait, for the test that compares the served source with the compiled-in one.
arvo-data = { git = "https://github.com/wjpin84/arvo-desktop.git", tag = "v0.1.0" }
